<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>kk_create_2901 | इतिहासाच्या नोट्स</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="container">

        <div class="logo">
            kk_create_2901
        </div>

        <div class="divider"></div>


        <h2>
            इतिहासाच्या अभ्यासविश्वात आपले स्वागत
        </h2>


        <p class="description">
            भारतीय इतिहासाच्या नोट्स पाहण्यासाठी
            कृपया आपली माहिती भरा.
        </p>


        <form action="subjects.html">

            <div class="form-group">

                <label for="name">
                    नाव
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="आपले पूर्ण नाव लिहा"
                    required>

            </div>


            <div class="form-group">

                <label for="age">
                    वय
                </label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="आपले वय"
                    min="1"
                    max="120"
                    required>

            </div>


            <div class="form-group">

                <label for="mobile">
                    मोबाईल नंबर
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="10 अंकी मोबाईल नंबर"
                    maxlength="10"
                    required>

            </div>


            <button
                type="submit"
                class="continue-btn">

                पुढे चला →

            </button>

        </form>


        <div class="footer">
            भारतीय इतिहासाच्या अभ्यासासाठी
        </div>

    </main>

</body>

</html>
